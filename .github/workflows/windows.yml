name: Windows installer

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Tests
        run: |
          python tests/test_backend.py
          python app/main.py --selftest

      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import sys; sys.path.insert(0,"app"); import nuty; print(nuty.__version__)')" >> "$GITHUB_OUTPUT"

      - name: PyInstaller
        run: pyinstaller --noconfirm nuty.spec

      - name: Selftest of the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\NutyMusicXML\NutyMusicXML.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\NutyMusicXML-out.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest exit $($p.ExitCode)" }

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ steps.ver.outputs.v }} installer\NutyMusicXML.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: NutyMusicXML-Setup-${{ steps.ver.outputs.v }}
          path: windows/dist/NutyMusicXML-Setup-*.exe

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Nuty → MusicXML ${{ steps.ver.outputs.v }}
          body_path: .github/release-notes.md
          files: windows/dist/NutyMusicXML-Setup-*.exe
