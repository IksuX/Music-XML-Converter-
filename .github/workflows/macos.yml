name: macOS app

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    concurrency:
      group: release-upload
      cancel-in-progress: false
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: echo "v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' build.sh)" >> "$GITHUB_OUTPUT"

      - name: Build (universal)
        run: UNIVERSAL=1 bash build.sh

      - name: Check
        run: |
          APP="build/Nuty MusicXML.app"
          lipo -info "$APP/Contents/MacOS/NutyMusicXML"
          test -f "$APP/Contents/Resources/wektor_pdf.py"
          test -f "$APP/Contents/Resources/Player/index.html"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep "$APP"

      - name: Engine installer (as the app runs it)
        run: |
          APP="build/Nuty MusicXML.app"
          test -f "$APP/Contents/Resources/zainstaluj-silniki.sh"
          for what in narzedzia ocr audiveris; do
            NUTY_GUI=1 /bin/bash "$APP/Contents/Resources/zainstaluj-silniki.sh" $what < /dev/null
          done
          SUP="$HOME/Library/Application Support/NutyMusicXML"
          test -x "$SUP/tools-venv/bin/python3"
          ls "$HOME/Library/Application Support/AudiverisLtd/audiveris/tessdata"
          A=/Applications/Audiveris.app; [ -d "$A" ] || A="$HOME/Applications/Audiveris.app"
          test -x "$A/Contents/MacOS/Audiveris"
          # second run must detect what is already installed
          NUTY_GUI=1 /bin/bash "$APP/Contents/Resources/zainstaluj-silniki.sh" narzedzia | grep "już jest"

      - name: Vector reader test
        run: |
          "$HOME/Library/Application Support/NutyMusicXML/tools-venv/bin/python3" -I -c "
          import pymupdf, sys, tempfile, os
          sys.path.insert(0, 'Resources'); import wektor_pdf as w
          d = pymupdf.open(); d.new_page().insert_text((72, 72), 'test')
          p = os.path.join(tempfile.mkdtemp(), 't.pdf'); d.save(p)
          x, warn = w.convert(p); assert x is None; print('OK', w.VERSION, pymupdf.__version__)"

      - name: Package
        run: |
          V=${{ steps.ver.outputs.v }}
          D="out/Nuty MusicXML $V"
          mkdir -p "$D"
          cp -R "build/Nuty MusicXML.app" "$D/"
          cp zainstaluj-silniki.sh README.md "$D/"
          cd out && ditto -c -k --sequesterRsrc --keepParent "Nuty MusicXML $V" "NutyMusicXML-macOS-$V.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NutyMusicXML-macOS-${{ steps.ver.outputs.v }}
          path: macos/out/NutyMusicXML-macOS-*.zip

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Nuty → MusicXML ${{ steps.ver.outputs.v }}
          body_path: .github/release-notes.md
          files: macos/out/NutyMusicXML-macOS-*.zip
